<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Accessibility trade-off (CDC §12 — AA contrast, keyboard navigation): user-scalable=no
      disables pinch-to-zoom app-wide for a native-app feel consistent with the fixed bottom
      nav, but low-vision users may rely on pinch-zoom to read content. Accepted for now as a
      project-level default, not a permanent decision — see docs/DEFAULTS-A-CHALLENGER.md. If
      a specific screen/zone later needs zoom (e.g. viewing a document/certificate image),
      re-enable it scoped to that one zone (dedicated <meta> override or component-level
      solution), not globally.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AS Caribbean" />
    <meta name="theme-color" content="#030201" />
    <!--
      specs/web-users-invitation-links.md §3 "Le logo: via le link preview,
      pas le texte" — a plain-text clipboard message can't carry an image,
      and WhatsApp/SMS ignore HTML clipboard content, so the logo reaches
      the member through the link preview a messaging app builds from these
      Open Graph tags when unfurling the /activation URL. Static, in the
      HTML head — a preview crawler never executes the SPA's JavaScript, so
      tags injected at runtime would be invisible to it. One global preview
      for every app URL (not scoped to /activation specifically) — see
      docs/DEFAULTS-A-CHALLENGER.md, acceptable while /activation is the
      only link ever shared this way.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AS Caribbean" />
    <meta property="og:description" content="Invitation à rejoindre l'application de l'AS Caribbean." />
    <meta property="og:image" content="https://as-caribeean-club-app.netlify.app/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>AS Caribbean</title>
  </head>
  <body translate="no">
    <div id="root"></div>
    <script type="module" src="/src/presentation/app/main.tsx"></script>
  </body>
</html>
